<svg width="1540" height="616" viewBox="0 0 1540 616" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1540" y2="616" gradientUnits="userSpaceOnUse">
<stop stop-color="#0A0F2C"/>
<stop offset="0.4" stop-color="#1a1f4a"/>
<stop offset="0.7" stop-color="#2d1f52"/>
<stop offset="1" stop-color="#3d2456"/>
</linearGradient>
<radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#8B5A2B" stop-opacity="0.5"/>
<stop offset="0.4" stop-color="#6B4422" stop-opacity="0.3"/>
<stop offset="1" stop-color="#4B3319" stop-opacity="0"/>
</radialGradient>
<filter id="blur">
<feGaussianBlur stdDeviation="50"/>
</filter>
</defs>

<!-- Background -->
<rect width="1540" height="616" rx="50" fill="url(#bg)"/>

<!-- Warm glow behind shield -->
<ellipse cx="1200" cy="308" rx="320" ry="280" fill="url(#warmGlow)" filter="url(#blur)"/>

<!-- Left side - horizontal bars representing text/menu -->
<g opacity="0.7">
<rect x="164" y="226" width="600" height="50" rx="25" fill="#4a4560"/>
<rect x="164" y="306" width="528" height="50" rx="25" fill="#4a4560"/>
<rect x="164" y="386" width="388" height="50" rx="25" fill="#4a4560"/>
</g>

<!-- Right side - Large hexagonal shield with checkmark -->
<g transform="translate(1050 150)">
<!-- Hexagon shield background -->
<path d="M 150 0 L 300 40 L 300 200 Q 300 280 150 340 Q 0 280 0 200 L 0 40 Z" fill="#3d2f1a"/>
<!-- Hexagon shield outline -->
<path d="M 150 0 L 300 40 L 300 200 Q 300 280 150 340 Q 0 280 0 200 L 0 40 Z" fill="none" stroke="#FFB11B" stroke-width="14" stroke-linejoin="round"/>
<!-- Checkmark -->
<path d="M 75 170 L 120 215 L 225 100" stroke="#FFB11B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- Decorative dots -->
<circle cx="1003" cy="162" r="8" fill="#FFB11B" opacity="0.6"/>
<circle cx="1326" cy="162" r="6" fill="#FFB11B" opacity="0.5"/>
<circle cx="968" cy="232" r="10" fill="#FFB11B" opacity="0.5"/>
<circle cx="1433" cy="336" r="7" fill="#FFB11B" opacity="0.6"/>
<circle cx="1365" cy="478" r="9" fill="#FFB11B" opacity="0.5"/>
</svg>